name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here: two of the bugs this repo has already hit were
        # Windows-only path handling in the toolchain, caught by hand rather than by CI.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # No `cache: npm`. There are zero dependencies and therefore no lockfile, and
          # the cache step hard-fails with "Dependencies lock file is not found".

      - name: Versions
        shell: bash
        run: node --version && npm --version

      # No install step at all: zero dependencies means the npm registry is not in this
      # pipeline's trust boundary. `npm test` runs the purity lint, then the test runner.
      - name: Test
        shell: bash
        run: npm test

      - name: Module graph
        shell: bash
        run: npm run test:graph

  # IndexedDB, WebCrypto non-extractable keys, MediaRecorder, the Web Speech API, service
  # workers and the CSP do not exist in Node, so `npm test` is blind to all of them. Chrome
  # is preinstalled on the runners; one OS is enough, since this covers app behaviour rather
  # than platform differences.
  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Browser checks
        shell: bash
        env:
          # Locally a missing Chrome is a skip; here it must be a failure, or this job
          # goes green having checked nothing.
          BROWSER_CHECK_REQUIRED: '1'
        run: npm run test:browser

  # The native Android app (android/). It has its own Gradle dependencies, but it shares the
  # one required check: a PR that breaks the Kotlin port, or regenerates the golden vectors
  # without the port following, must not merge any more than one that breaks the web app.
  # It runs on every PR because a skipped job in the gate counts as a failure there, and a
  # `paths:` filter on this workflow would leave the required check hanging at "Expected".
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Validates gradle-wrapper.jar against Gradle's published checksums before anything
      # runs it, and caches dependencies. The cache is read-only on PRs, so a PR cannot
      # poison what main builds with.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Versions
        run: java -version && ./gradlew --version

      - name: Check and build
        run: ./gradlew --no-daemon check :app:assembleDebug

      - name: Verify release package signing with disposable keys
        working-directory: .
        run: bash tools/test-android-packages.sh

      - name: Upload the debug APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ideaforge-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 14

  # The one and only required status check.
  #
  # Requiring the matrix legs by name instead would mean every edit to the matrix silently
  # orphans a required context, which then hangs at "Expected" on every PR forever. This
  # name never changes however the matrix grows.
  #
  # `if: always()` is load-bearing: without it this job is SKIPPED when `test` fails, and
  # GitHub counts a skipped check as passing — so the gate would wave through the exact
  # failures it exists to catch.
  ci:
    name: ci
    if: always()
    needs: [test, browser, android]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          echo "upstream results: $RESULTS"
          for r in $RESULTS; do
            # Checks for != success rather than == failure, so `cancelled` and `skipped`
            # are caught too.
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
